name: Release

# 两条发布路径，任选其一（都要求交互式 2FA，token 不能替代）：
#
# A. 本地直接发布（当前常用，最简单）：
#      npm publish --registry=https://registry.npmjs.org/ --otp=<6位码>
#    注意 ~/.npmrc 默认 registry 是 npmmirror 镜像，**必须显式带 --registry**，否则写操作 401。
#
# B. CI 暂存 + 人工批准（本 workflow）：
#      CI（Granular token，无需 2FA）:  npm stage publish  → 产出 stage id
#      你本人（一次 OTP）             :  npm stage approve <stage-id> --otp=<6位码>
#    前置：仓库 Settings → Secrets → Actions 配置 NPM_TOKEN（Permissions: Packages: Read and write）。
#
# 为什么不用 OIDC trusted publishing：npm 的 Trusted Publisher 设置页当时打不开，故未启用。
# 直连发布（npm publish）用任何 token 都会被要求交互式 2FA（EOTP），故 token 只用于「暂存」。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: 升级 npm（stage 命令需要较新 CLI）
        run: npm install -g npm@latest

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json $PKG 不一致"
            exit 1
          fi
          echo "版本校验通过：$PKG"

      - name: 安装构建依赖并构建
        run: |
          npm install --no-save --no-audit --no-fund esbuild@^0.28.2
          node build.mjs

      - name: 校验版本号三处一致（package.json / CHANGELOG / README）
        run: node test/check-release.mjs --tag "$GITHUB_REF_NAME"

      - name: 校验入库的 lib/client.js 与源码一致
        run: |
          if ! git diff --quiet -- lib/client.js; then
            echo "::error::lib/client.js 与源码不一致，请本地 node build.mjs 后提交"
            git diff --stat -- lib/client.js
            exit 1
          fi

      - name: 离线验证（聚合口径 / 路由 / 报告 / i18n）
        run: node test/verify.mjs

      - name: 检查该版本是否已发布
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "dsh-workload-report@$V" version >/dev/null 2>&1; then
            echo "::error::dsh-workload-report@$V 已在 npm 上，不能重复发布"
            exit 1
          fi

      - name: 暂存发布（2FA 推迟到人工批准）
        shell: bash
        run: |
          # set -e: 任一命令失败即退出。
          # set -o pipefail: 没有它的话 `npm ... | tee` 只取 tee 的退出码，
          #   npm 在 ENEEDAUTH / EPERM 下失败也会被 tee 的 0 覆盖 —— 步骤报绿但什么都没发。
          # 这正是 v1.0.1 第一次「显示 success、npm 上却查无此版本」的根因。
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret 为空 —— 请先在仓库 Settings → Secrets 配置 NPM_TOKEN"
            exit 1
          fi

          npm stage publish --registry=https://registry.npmjs.org/ 2>&1 | tee /tmp/stage.out

          # 注意：不要用双引号包住反引号（会被 shell 二次求值成命令，报 `1.0.1: command not found`）。
          VERSION="$(node -p "require('./package.json').version")"
          ID="$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/stage.out | head -1 || true)"

          if [ -z "$ID" ]; then
            echo "::error::npm stage publish 未返回 stage id，请查看上方日志确认是否真的暂存成功"
            exit 1
          fi

          {
            echo "### ⏳ 已暂存，等待你批准"
            echo ""
            echo "版本：${VERSION} · stage id：${ID}"
            echo ""
            echo "本地执行（一次 OTP）："
            echo ""
            echo '```bash'
            echo "npm stage approve ${ID} --registry=https://registry.npmjs.org/ --otp=<6位验证码>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
