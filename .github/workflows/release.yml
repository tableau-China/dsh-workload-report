name: Release

# 为什么不用 OIDC trusted publishing：npm 的设置页（Settings → Trusted Publisher）
# 当时无法打开，而 npm 现在要求发布必须有交互式 2FA。改为"CI 暂存 + 人工批准"：
#   CI（token，无需 2FA）:  npm stage publish   → 产出 stage id
#   你本人（一次 OTP）    :  npm stage approve <stage-id> --otp=<6位码>
# 直连发布（npm publish）用任何 token 都会被要求交互式 2FA（EOTP），故不采用。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: 升级 npm（stage 命令需要较新 CLI）
        run: npm install -g npm@latest

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json $PKG 不一致"
            exit 1
          fi
          echo "版本校验通过：$PKG"

      - name: 安装构建依赖并构建
        run: |
          npm install --no-save --no-audit --no-fund esbuild@^0.28.2
          node build.mjs

      - name: 校验入库的 lib/client.js 与源码一致
        run: |
          if ! git diff --quiet -- lib/client.js; then
            echo "::error::lib/client.js 与源码不一致，请本地 node build.mjs 后提交"
            git diff --stat -- lib/client.js
            exit 1
          fi

      - name: 离线验证（聚合口径 / 路由 / 报告 / i18n）
        run: node test/verify.mjs

      - name: 检查该版本是否已发布
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "dsh-workload-report@$V" version >/dev/null 2>&1; then
            echo "::error::dsh-workload-report@$V 已在 npm 上，不能重复发布"
            exit 1
          fi

      - name: 暂存发布（2FA 推迟到人工批准）
        run: |
          npm stage publish --registry=https://registry.npmjs.org/ | tee /tmp/stage.out
          ID="$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/stage.out | head -1)"
          {
            echo "### ⏳ 已暂存，等待你批准"
            echo ""
            echo "版本：`$(node -p "require('./package.json').version")` · stage id：`$ID`"
            echo ""
            echo "本地执行（一次 OTP）："
            echo ""
            echo '```bash'
            echo "npm stage approve $ID --registry=https://registry.npmjs.org/ --otp=<6位验证码>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
